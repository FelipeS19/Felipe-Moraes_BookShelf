name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and Test Backend
      run: |
        cd backend
        mvn clean test
        
    - name: Build and Test Review Service
      run: |
        cd review-service
        mvn clean test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Backend Image
      run: docker build -t library/backend:latest ./backend
      
    - name: Build Review Service Image
      run: docker build -t library/review-service:latest ./review-service
